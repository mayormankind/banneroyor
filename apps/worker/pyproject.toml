[project]
name = "banner-recall-worker"
version = "0.1.0"
description = "Banner Recall background processing worker"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0",
  "supabase>=2.10.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
